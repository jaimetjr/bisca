name: Android Build (EAS)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'server/**'
      - 'server_dist/**'
      - 'docs/**'
      - 'store/**'
      - 'tests/**'
      - 'mocks/**'
      - 'scripts/**'
      - '**/*.md'
      - 'Dockerfile'
      - '.dockerignore'
      - 'drizzle.config.ts'
      - 'vitest.config.ts'
      - 'eslint.config.js'
      - '.env.example'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Build Android (production profile)
        run: eas build --platform android --profile production --non-interactive --no-wait
